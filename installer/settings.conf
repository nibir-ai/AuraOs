# Calamares main configuration file for AuraOS installer
---
modules-search: [ "/usr/lib/calamares/modules", "/usr/share/calamares/modules", "./modules" ]

instances:
  - id:       auraos
    module:   branding
    config:   branding.desc

sequence:
  - show:
    - welcome
    - locale
    - keyboard
    - partition
    # Skip standard user creation since we use Google Accounts via GDM/PAM
    # - users
    - summary
  - exec:
    - partition
    - mount
    - unpackfs
    - sources-yokel
    - machineid
    - fstab
    - locale
    - keyboard
    - localecfg
    # Custom Google Authentication hook to pre-create accounts
    - aura-google-auth
    - initramfscfg
    - bootloader
    - umount
  - show:
    - finished

brand-package: "auraos-branding"
displaymode: "standalone"
