[package]
name = "aura-cli"
version = "0.1.0"
edition = "2021"
description = "AuraOS command-line interface to Gemini assistant"
license = "GPL-3.0-or-later"

[dependencies]
tokio = { version = "1", features = ["full"] }
zbus = { version = "4", features = ["tokio"] }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
anyhow = "1"
colored = "2"
