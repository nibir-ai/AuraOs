# AuraOS Debian/Ubuntu Preseed Configuration File
# For automating the baseline operating system setup.

# 1. Localization
d-i debian-installer/locale string en_US.UTF-8
d-i console-setup/ask_detect boolean false
d-i console-setup/layoutcode string us

# 2. Network Configuration
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string auraos-pc
d-i netcfg/get_domain string localdomain
d-i netcfg/wireless_wep string

# 3. Mirror Settings
d-i mirror/country string manual
d-i mirror/http/hostname string archive.ubuntu.com
d-i mirror/http/directory string /ubuntu
d-i mirror/http/proxy string

# 4. Clock and Time Zone
d-i clock-setup/utc boolean true
d-i time/zone string UTC
d-i clock-setup/ntp boolean true

# 5. Partitioning (Auto LUKS Full Disk Encryption Setup)
d-i partman-auto/method string crypto
d-i partman-crypto/passphrase string auraosdefault
d-i partman-crypto/passphrase-again string auraosdefault
d-i partman-auto/choose_recipe select home-recommended
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# 6. Base System Installation
d-i base-installer/kernel/image string linux-generic

# 7. Package Selection and Updates
d-i pkgsel/include string openssh-server build-essential curl git cryptsetup TPM2-tools
d-i pkgsel/upgrade select safe-upgrade
d-i pkgsel/update-policy select none

# 8. Bootloader Installation
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true

# 9. Post-Installation Hooks (e.g. enabling services, GDM overlays)
d-i preseed/late_command string \
    in-target systemctl enable systemd-resolved; \
    in-target mkdir -p /var/lib/auraos/accounts; \
    in-target chmod 700 /var/lib/auraos/accounts
