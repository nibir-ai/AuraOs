[package]
name = "aura-installer"
version = "0.1.0"
edition = "2021"
description = "Custom GTK4/Libadwaita Installer for AuraOS"
license = "GPL-3.0-or-later"
authors = ["AuraOS Contributors"]

[dependencies]
# GTK 4 and Libadwaita bindings
gtk4 = { version = "0.8", features = ["v4_10"] }
libadwaita = { version = "0.6", features = ["v1_3"] }

# Async runtime for executing partition and build steps
tokio = { version = "1", features = ["full"] }

# System information to list storage disks
sysinfo = "0.30"

# Serialization / parsing
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging and error handling
tracing = "0.1"
tracing-subscriber = { version = "0.3" }
anyhow = "1"
thiserror = "2"
