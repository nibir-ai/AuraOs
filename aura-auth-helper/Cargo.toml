[package]
name = "aura-auth-helper"
version = "0.1.0"
edition = "2021"
description = "AuraOS OAuth 2.0 PKCE authentication helper for first-boot Google sign-in"
license = "GPL-3.0-or-later"
authors = ["AuraOS Contributors"]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client for OAuth token exchange
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# JSON handling
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Cryptography for PKCE
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"

# JWT parsing (id_token)
jsonwebtoken = "9"

# GNOME Keyring / libsecret via D-Bus
secret-service = "4"

# Linux user management
nix = { version = "0.29", features = ["user", "process"] }

# URL encoding
urlencoding = "2"

# HTTP server for OAuth redirect capture
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Process execution (useradd, etc.)
which = "7"
